name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # The rust-worker job covers the build, so this one needs no toolchain
      SKIP_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uvx ty@0.0.99 check src/
      - run: uv run pytest

  # `uv tool install` ignores uv.lock and takes the newest allowed versions,
  # so what users install can differ from what the other jobs test
  fresh-install:
    runs-on: ubuntu-latest
    env:
      SKIP_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: >-
          uv run --isolated --no-project --python 3.12
          --with . --with pytest --with pytest-asyncio --with respx
          pytest tests/unit/test_worker_upload.py -o addopts="" -p no:cacheprovider

  rust-worker:
    runs-on: ubuntu-latest
    env:
      REQUIRE_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --locked
        working-directory: src/proxyflare/workers/rust
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --wheel
      - name: Check that the wheel contains the Rust worker
        run: |
          contents="$(python3 -m zipfile -l dist/*.whl)"
          grep -q 'workers/rust/build/index.js' <<< "$contents"
          grep -q 'workers/rust/build/index_bg.wasm' <<< "$contents"

  worker-contract:
    runs-on: ubuntu-latest
    env:
      REQUIRE_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/contract --no-cov

  telegram-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-md-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram-md-bot/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p test/tsconfig.json
      - run: npx vitest run
      - run: npm audit --omit=dev
